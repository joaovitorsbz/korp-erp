server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /projeto-korp {
        proxy_pass http://http-server-projeto-korp:8080/projeto-korp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /metrics {
        proxy_pass http://http-server-projeto-korp:8080/metrics;
        proxy_set_header Host $host;
    }
}

# Status interno do NGINX, usado pelo nginx-prometheus-exporter para
# detectar se o proprio proxy (o ponto de entrada externo) esta no ar.
# Nao publicado no host, so acessivel dentro da rede korp-net.
server {
    listen 8081;
    access_log off;

    location /nginx_status {
        stub_status;
        allow all;
    }
}
